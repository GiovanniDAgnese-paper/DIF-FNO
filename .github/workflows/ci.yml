name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          # CPU wheels keep the CI matrix fast (~10x smaller than the CUDA ones)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest tests -v --cov=dagnese_fno --cov-report=term-missing

  smoke:
    name: end-to-end smoke (data + 2 epochs)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Generate a tiny dataset
        run: python scripts/generate_data.py --domains star --n 32 --samples 8 --out data
      - name: Train 2 epochs (baseline, DIF-FNO v1, chart operator)
        run: |
          python scripts/train.py --domain star --model fno --epochs 2 --data-dir data --width 8 --modes1 4 --modes2 4
          python scripts/train.py --domain star --model dif --epochs 2 --data-dir data --width 8 --modes1 4 --modes2 4 --lambda-barrier 1
          python scripts/train.py --domain star --model dif --epochs 2 --data-dir data --width 8 --modes1 4 --modes2 4 \
            --lipschitz-mode spectral --conditioning global --deformation-scale 0.5
          python scripts/train.py --domain star --model chart --epochs 2 --data-dir data --width 8 --modes1 4 --modes2 4 --lambda-eq 10
          python scripts/train.py --domain star --model chart --epochs 2 --data-dir data --width 8 --modes1 4 --modes2 4 \
            --chart-conditioning global --latent-dim 4 --lambda-eq 10

      - name: Deterministic verification of P5-P8
        run: python scripts/run_chart_study.py --quick --out /tmp/study --figures /tmp/study-figs

      - name: The committed tables are reproducible from the committed runs
        # Regenerate the paper's tables from results/v2/*.json and fail if they
        # differ from what is checked in: the paper's numbers cannot drift.
        run: |
          python scripts/make_paper_table.py --figure /tmp/fig
          python scripts/report_stats.py --results results/v2 --out /tmp/STATS.json
          git diff --exit-code paper/tables/benchmark.tex results/v2/TABLE.md
